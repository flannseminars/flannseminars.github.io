name: Tasting Menu — nominate a paper
description: Propose a paper for a configured FLaNN Tasting Menu round.
title: "[Tasting Menu] "
labels: ["tasting-menu"]
body:
  - type: markdown
    attributes:
      value: |
        This form is the proposed public intake for FLaNN's Tasting Menu. Its presence does not mean a round is open. Check the website's current round and dates before submitting.

        Search existing nominations first. To endorse an existing paper, use the recommendation comment template in `docs/TASTING_MENU.md` instead of opening another issue.

        **Public data notice:** your GitHub username, paper details, recommendation and comment will be public on this issue and may be reproduced on FLaNN's website with attribution and a link. Do not include private information. Submitting this form agrees to that use. Papers reaching 20 points qualify once hosts validate eligibility and check for foul play. Hosts invite qualifying papers' authors; they do not rerank the community's choices.
  - type: input
    id: edition
    attributes:
      label: Edition
      description: Use the exact edition ID advertised by the open call. The draft pilot ID is “pilot”.
      placeholder: pilot
    validations:
      required: true
  - type: input
    id: paper-title
    attributes:
      label: Paper title
    validations:
      required: true
  - type: input
    id: paper-url
    attributes:
      label: Paper URL
      description: Use an HTTPS arXiv abstract or DOI link where possible, so endorsements merge correctly.
      placeholder: https://arxiv.org/abs/2401.01234
    validations:
      required: true
  - type: input
    id: authors
    attributes:
      label: Authors
    validations:
      required: true
  - type: input
    id: published
    attributes:
      label: Published
      description: Publication or first public preprint date, in YYYY-MM-DD format. Hosts verify cycle eligibility.
      placeholder: YYYY-MM-DD
    validations:
      required: true
  - type: input
    id: topic
    attributes:
      label: Topic
      description: A short topic or area, in your own words.
    validations:
      required: true
  - type: dropdown
    id: relationship
    attributes:
      label: Relationship
      description: Disclose authorship, collaboration or other interests. Author and conflicted recommendations count at most +1.
      options:
        - Independent reader
        - Author / coauthor
        - Other conflict of interest
    validations:
      required: true
  - type: dropdown
    id: recommendation
    attributes:
      label: Recommendation
      description: Recommend for +1 or strongly recommend for +5. Both need a comment of at least 20 characters. Four +5 endorsements, twenty +1 recommendations, or a mixture reaching 20 points qualify after host validation. Check the current call for this edition's rules.
      options:
        - Recommend (+1)
        - Strongly recommend (+5)
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why do you believe this is a good paper?
      description: Write at least 20 characters in your own words. You might discuss its implications, why you believe it is good, or why others should spend time on it. There is no required review format.
    validations:
      required: true
